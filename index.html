{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancaME - Banca Digital</title>
    <link rel="stylesheet" href="{% static 'bancame.css' %}">
</head>
<body>
    <!-- Barra de navegación -->
    <header class="navbar">
        <div class="logo">
            <span class="banca">Banca</span><span class="me">ME</span>
        </div>
    </header>

    <!-- Contenedor principal -->
    <div class="main-container">
        
        <!-- Sección de Login -->
        <div id="login-section">
            <h2>Iniciar Sesión</h2>
            <form id="form-login">
                <label for="usuario-login">Usuario</label>
                <input type="text" id="usuario-login" required>
                
                <label for="password-login">Contraseña</label>
                <input type="password" id="password-login" required>
                
                <button type="submit">Entrar</button>
            </form>
            <p>¿No tienes cuenta? <a href="#" id="show-register">Regístrate aquí</a></p>
        </div>

        <!-- Sección de Registro (Oculta por defecto) -->
        <div id="register-section" style="display: none;">
            <h2>Registro</h2>
            <form id="form-register">
                <label for="usuario-reg">Nuevo Usuario</label>
                <input type="text" id="usuario-reg" required>
                
                <label for="password-reg">Contraseña</label>
                <input type="password" id="password-reg" required>
                
                <button type="submit">Registrarse</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="#" id="show-login">Inicia sesión</a></p>
        </div>

        <!-- Sección de Dashboard / Cuenta (Oculta hasta iniciar sesión) -->
        <div id="dashboard-section" style="display: none;">
            <h2>Bienvenido a tu cuenta</h2>
            <p><strong>Cuenta Corriente:</strong> ES91 2100 0456 7812 3456 7890</p>
            <p><strong>Saldo Disponible:</strong> $ 1,250,450.00 ARS</p>
            
            <div class="actions">
                <button type="button" id="btn-transferir">Transferir</button>
                <button type="button" id="btn-servicios">Servicios</button>
                <button type="button" id="btn-tarjetas">Tarjetas</button>
            </div>
            <br>
            <button type="button" id="btn-logout" style="background-color: #d9534f; color: white; width: 100%;">Cerrar Sesión</button>
        </div>

    </div>

    <!-- Enlazamos el archivo de JavaScript -->
    <script src="{% static 'script.js' %}"></script>
</body>
</html>
